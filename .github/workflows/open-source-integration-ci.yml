name: Open Source Integration Hardening

on:
  push:
    branches: [open-source-integration-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-source-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Clean
        run: ./gradlew clean --stacktrace
      - name: Unit tests
        run: ./gradlew test --stacktrace
      - name: Lint
        run: ./gradlew lintDebug --stacktrace
      - name: Compile Android tests
        run: ./gradlew assembleDebugAndroidTest --stacktrace
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Assemble release AAB
        run: ./gradlew bundleRelease --stacktrace
      - name: Source language inventory
        shell: bash
        run: |
          mkdir -p build/reports/open-source-integration
          find . -type f \
            \( -name '*.kt' -o -name '*.java' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' -o -name '*.h' -o -name '*.hpp' -o -name '*.rs' -o -name '*.go' -o -name '*.py' -o -name '*.js' -o -name '*.ts' -o -name '*.lua' \) \
            -not -path './.git/*' -not -path '*/build/*' -not -path '*/.cxx/*' -not -path './.gradle/*' -not -path './third_party/*' \
            | sort > build/reports/open-source-integration/source-language-files.txt
          awk -F. 'NF > 1 { ext=$NF; count[ext]++ } END { for (ext in count) print ext, count[ext] }' \
            build/reports/open-source-integration/source-language-files.txt | sort \
            > build/reports/open-source-integration/source-language-counts.txt
          cat build/reports/open-source-integration/source-language-counts.txt
      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: open-source-integration-build-evidence
          path: |
            build/reports/open-source-integration/
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  instrumentation:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Connected Android instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace
