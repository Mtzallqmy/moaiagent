name: Phase 4 Verification

on:
  push:
    branches: [phase4-browser-tasks-research]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Clean
        run: ./gradlew clean --stacktrace
      - name: Unit tests
        run: ./gradlew test --stacktrace
      - name: Lint
        run: ./gradlew lintDebug --stacktrace
      - name: Compile Android UI tests
        run: ./gradlew assembleDebugAndroidTest --stacktrace
      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace
      - name: Assemble release
        run: ./gradlew assembleRelease --stacktrace

  instrumentation:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run local-page browser and Phase 4 UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace
