name: Phase 5 Verification

on:
  push:
    branches: [phase5-model-driven-planner]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase5-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Clean
        run: ./gradlew clean --stacktrace
      - name: Planner and runtime unit tests
        run: ./gradlew :core:tasks:testDebugUnitTest :core:runtime:testDebugUnitTest --stacktrace
      - name: Full unit tests
        run: ./gradlew test --stacktrace
      - name: Lint
        run: ./gradlew lintDebug --stacktrace
      - name: Compile Android UI tests
        run: ./gradlew assembleDebugAndroidTest --stacktrace
      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace
      - name: Assemble release
        run: ./gradlew assembleRelease --stacktrace
      - name: Inventory first-party source languages
        shell: bash
        run: |
          mkdir -p build/reports/phase5
          find . -type f \
            \( -name '*.kt' -o -name '*.java' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' -o -name '*.h' -o -name '*.hpp' -o -name '*.rs' -o -name '*.go' -o -name '*.py' -o -name '*.js' -o -name '*.ts' -o -name '*.lua' \) \
            -not -path './.git/*' -not -path '*/build/*' -not -path './.gradle/*' \
            | sort > build/reports/phase5/source-language-files.txt
          awk -F. 'NF > 1 { ext=$NF; count[ext]++ } END { for (ext in count) print ext, count[ext] }' \
            build/reports/phase5/source-language-files.txt | sort > build/reports/phase5/source-language-counts.txt
          cat build/reports/phase5/source-language-counts.txt
      - name: Inventory APK native libraries
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | awk '/ lib\/.+\.so$/ { print $4 }' | sort > build/reports/phase5/apk-native-libraries.txt
          cat build/reports/phase5/apk-native-libraries.txt
      - name: Record Phase 5 build evidence
        shell: bash
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "database_schema_version=4"
            echo "planner_tests=passed"
            echo "runtime_evidence_tests=passed"
            echo "debug_apk=app/build/outputs/apk/debug/app-debug.apk"
            echo "release_apk=app/build/outputs/apk/release/app-release-unsigned.apk"
          } > build/reports/phase5/build-evidence.txt
      - name: Upload Phase 5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase5-build-evidence
          path: |
            build/reports/phase5/
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  instrumentation:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace
